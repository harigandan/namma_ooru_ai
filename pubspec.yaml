name: namma_ooru_ai
description: "AI-Powered Smart Civic Governance Platform for Tamil Nadu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.1

  # Networking & Serialization
  dio: ^5.4.1
  json_annotation: ^4.8.1

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # Media & Hardware
  image_picker: ^1.0.7

  # UI & Design System
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  intl: '>=0.19.0 <1.0.0'
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/
