# ==============================================================================
# Namma Ooru AI — Production Nginx Configuration
# Multiplatform Civic Governance Portal (Flutter Web + FastAPI + PostgreSQL PostGIS)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip Compression for Web Bundle & Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream FastAPI ASGI Backend
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Server — Redirect all HTTP traffic to HTTPS (with ACME challenge)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # HTTP to HTTPS redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Server — Production SSL with Custom Domain
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # SSL Certificates (managed by Certbot)
        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # Modern SSL Ciphers & Protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body limit for photo uploads (up to 25MB)
        client_max_body_size 25M;

        # ----------------------------------------------------------------------
        # FastAPI Backend API Proxy (/api/v1/)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # FastAPI Interactive Swagger Docs (/docs) & OpenAPI Spec (/openapi.json)
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_set_header Host $host;
        }

        # Static Complaint & Photo Uploads (/uploads/)
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Flutter Multiplatform Web SPA (/usr/share/nginx/html)
        # ----------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache assets for 7 days
            location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|wasm|json)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
            }

            # Never cache index.html to ensure live Flutter updates
            location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }
        }
    }
}
