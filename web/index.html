<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Namma Ooru AI - Tamil Nadu Civic Governance & Grievance Redressal Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="namma_ooru_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Namma Ooru AI • நம்ம ஊர் AI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Resilient Flutter Web Bootstrapper -->
  <script src="flutter_bootstrap.js" async onerror="loadFlutterFallback()"></script>
  <script>
    var flutterLoaded = false;
    window.addEventListener('flutter-first-frame', function () {
      flutterLoaded = true;
    });

    function loadFlutterFallback() {
      if (flutterLoaded) return;
      flutterLoaded = true;
      console.warn("flutter_bootstrap.js failed or unavailable. Bootstrapping via flutter.js fallback...");
      var script = document.createElement('script');
      script.src = 'flutter.js';
      script.onload = function () {
        if (window._flutter && window._flutter.loader) {
          if (typeof _flutter.loader.load === 'function') {
            _flutter.loader.load();
          } else if (typeof _flutter.loader.loadEntrypoint === 'function') {
            _flutter.loader.loadEntrypoint({
              onEntrypointLoaded: function (engineInitializer) {
                engineInitializer.initializeEngine().then(function (appRunner) {
                  appRunner.runApp();
                });
              }
            });
          }
        }
      };
      document.body.appendChild(script);
    }

    // Fallback if bootstrap doesn't trigger within 2500ms
    setTimeout(function () {
      if (!flutterLoaded && !window._flutterEngine) {
        loadFlutterFallback();
      }
    }, 2500);
  </script>
</body>
</html>
