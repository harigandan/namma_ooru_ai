version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: namma_ooru_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=namma-ooru-super-secret-production-key-change-in-prod-2026
      - DATABASE_URL=postgresql+asyncpg://namma_user:namma_secure_password@db:5432/namma_ooru_db
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgis/postgis:16-3.4
    container_name: namma_ooru_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: namma_user
      POSTGRES_PASSWORD: namma_secure_password
      POSTGRES_DB: namma_ooru_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
